name: Task / Bug / Feature
description: General work item. If you already know this is a multi-part initiative, use the Epic template instead.
projects: ["usegalaxy-be/12"]
body:
  - type: markdown
    attributes:
      value: |
        Before filling this in: can you state "done" in one sentence? If not, this is probably several issues - consider splitting now rather than at triage. See CONTRIBUTING.md for the full reasoning.

  - type: textarea
    id: description
    attributes:
      label: What needs to happen
      description: What's the problem, or what's being requested?
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done means
      description: One sentence. If it takes more than one, consider splitting into multiple issues or an Epic instead.
    validations:
      required: true

  - type: dropdown
    id: rfc
    attributes:
      label: Does this need an RFC?
      description: If yes, treat "write it and get it approved" as its own item (done = approved), separate from implementing the approved change - see CONTRIBUTING.md. Approval alone (writing, review turnaround, revision) rarely fits one iteration by itself.
      options:
        - "No"
        - "Yes"
        - "Not sure yet - decide at triage"
      default: 0
    validations:
      required: true
