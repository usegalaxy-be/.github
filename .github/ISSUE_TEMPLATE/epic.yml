name: Epic
description: A multi-part initiative that will be broken into sub-issues.
type: Epic
projects: ["usegalaxy-be/12"]
body:
  - type: markdown
    attributes:
      value: |
        Issue Type is set to **Epic** automatically by this template. Epics don't get an Effort or an Iteration - each sub-issue gets its own Effort and is scheduled on its own. Use real sub-issues for the breakdown, not a checklist in the body.

  - type: textarea
    id: description
    attributes:
      label: What is this initiative
    validations:
      required: true

  - type: dropdown
    id: goal-linked
    attributes:
      label: Does this serve a 2026 Objective?
      description: If yes, tag the Objective on the project board and add the OKR label + [OKR] title prefix. If no, it'll get tagged Reactive/not goal-linked at triage - that's expected, not a problem.
      options:
        - "Yes - tied to a specific Objective"
        - "No - not goal-linked"
        - "Not sure yet - decide at triage"
      default: 2
    validations:
      required: true

  - type: dropdown
    id: rfc
    attributes:
      label: Will any sub-part need an RFC?
      description: If yes, that sub-part should be its own sub-issue with done = approved, separate from implementing the approved change - see CONTRIBUTING.md.
      options:
        - "No"
        - "Yes"
        - "Not sure yet - decide at triage"
      default: 2
    validations:
      required: true

  - type: checkboxes
    id: why-epic
    attributes:
      label: Why does this need to be an Epic?
      description: If none of these actually apply, this might fit in one iteration as a regular Task instead - see CONTRIBUTING.md's iteration-fit guidance.
      options:
        - label: Depends on someone outside the team acting first (data center, VSC, ...), their schedule bounds the timeline regardless of how small the work is
        - label: At least one part is "investigate/figure out X" rather than "do X" - the investigation (done = a decision) and the eventual fix are separately scoped
        - label: Real elapsed calendar time is involved beyond the work itself (deploy windows, a verification period, external review)
        - label: No precedent - nobody's done something like this before, so a single confident estimate isn't realistic

  - type: textarea
    id: subissues
    attributes:
      label: Known sub-parts (optional)
      description: If you already know the pieces, list them here as a starting point - then add them as real sub-issues after creating this, not as a checklist.
