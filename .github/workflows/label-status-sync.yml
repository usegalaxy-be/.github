name: Label status sync (reusable)

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: number
      repo:
        required: true
        type: string
      label:
        required: true
        type: string
      action:
        required: true
        type: string

jobs:
  sync:
    if: inputs.label == 'blocked'
    runs-on: ubuntu-latest
    steps:
      - name: Skip if not activated
        if: ${{ secrets.PROJECTS_TOKEN == '' }}
        run: echo "PROJECTS_TOKEN not set, skipping (automation not yet activated)."

      - uses: actions/checkout@v4
        if: ${{ secrets.PROJECTS_TOKEN != '' }}
        with:
          repository: usegalaxy-be/.github

      - name: Sync status
        if: ${{ secrets.PROJECTS_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          ORG: usegalaxy-be
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          REPO: ${{ inputs.repo }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ACTION: ${{ inputs.action }}
        run: python3 scripts/sync_blocked_label.py
