name: Sync iteration dates

on:
  schedule:
    - cron: "*/30 * * * *"  # every 30 min, so triage changes get picked up promptly
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log what would change instead of writing it"
        type: boolean
        default: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if not activated
        if: ${{ secrets.PROJECTS_TOKEN == '' }}
        run: echo "PROJECTS_TOKEN not set, skipping (automation not yet activated)."

      - uses: actions/checkout@v4
        if: ${{ secrets.PROJECTS_TOKEN != '' }}

      - name: Sync dates
        if: ${{ secrets.PROJECTS_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          ORG: usegalaxy-be
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python3 scripts/sync_iteration_dates.py
